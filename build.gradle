plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	mods {
		"omwh" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs = ['src/main/java']
		}
		resources {
			srcDirs = ['src/main/resources']
		}
	}
}

['configTest': 'ConfigTest',
 'commandsAndCooldownsTest': 'CommandsAndCooldownsTest',
 'destinationsTest': 'DestinationsTest',
 'teleportServiceTest': 'TeleportServiceTest'].each { taskName, className ->
	tasks.register(taskName, JavaExec) {
		group = 'verification'
		dependsOn testClasses
		classpath = sourceSets.test.runtimeClasspath
		mainClass = "xyz.pyrehaven.omwh.${className}"
		workingDir = layout.buildDirectory.dir("test-runs/${taskName}")
		doFirst { workingDir.mkdirs() }
	}
}

tasks.register('regressionTest') {
	group = 'verification'
	dependsOn configTest, commandsAndCooldownsTest, destinationsTest, teleportServiceTest
}

check.dependsOn regressionTest

tasks.named('test') {
	failOnNoDiscoveredTests = false
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-command-api-v2:3.1.2+fcdff87f5d"
	implementation "net.fabricmc.fabric-api:fabric-entity-events-v1:6.0.4+3434d6d95d"
	implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.9+ffef5f675d"
	implementation "net.fabricmc.fabric-api:fabric-networking-api-v1:6.3.8+fcdff87f5d"
	implementation "net.fabricmc.fabric-api:fabric-api-base:2.0.6+fcdff87f5d"
	localRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
		// See https://docs.gradle.org/current/userguide/publishing_maven.html for more information
		// about publishing to Maven repositories.
		// mavenLocal()
	}
}

